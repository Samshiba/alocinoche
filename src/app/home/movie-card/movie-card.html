<div class="movie-card card m-3" (click)="goToMovie(movie.id!)">
  @if(movie.image) {
    <img [src]="'http://localhost:8080/movies/' + movie.id + '/image'" class="card-img-top" alt="">
  }
  <div class="card-body p-2">

    <h5 class="movie-title">
      {{ movie.title }}
    </h5>

    <div class="movie-info">
      <span class="rating">
        <i class="bi bi-star-fill"></i>
        {{ movie.rate }}/5
      </span>

      <span class="year">
        {{ movie.releaseDate | date:'yyyy' }}
      </span>
    </div>

  </div>
</div>
