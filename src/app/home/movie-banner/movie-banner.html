<div class="row align-items-center mb-5 pt-4">
  <div class="col-8 col-md-4 col-lg-3 mx-auto mb-4 mb-md-0">
    @if (movie.image) {
      <img
        [src]="'http://localhost:8080/movies/' + movie.id + '/image'"
        class="img-fluid rounded-4 shadow-lg hero-poster"
        alt="{{ movie.title }}"
      />
    }
  </div>

  <div class="col-12 col-md-8 col-lg-9 text-center text-md-start px-md-4">
    <span class="badge bg-danger mb-3 px-3 py-2 rounded-pill tracking-wider">À LA UNE</span>
    <h1 class="display-3 fw-bolder text-white mb-3 text-uppercase">{{ movie.title }}</h1>

    <div class="d-flex justify-content-center justify-content-md-start gap-4 mb-4 text-light">
      <span class="fs-5 fw-bold text-warning"
        ><i class="bi bi-star-fill"></i> {{ movie.rate }} / 10</span
      >
      <span class="fs-5"><i class="bi bi-camera-reels-fill"></i> {{ movie.director }}</span>
    </div>

    <p class="lead text-white-50 mb-5 hero-synopsis">
      {{ movie.synopsis }}
    </p>

    <div class="d-flex justify-content-center justify-content-md-start gap-3">
      <button class="btn btn-accent btn-lg rounded-pill px-4 fw-bold" (click)="goToMovie()">
        Détails
      </button>
    </div>
  </div>
</div>
