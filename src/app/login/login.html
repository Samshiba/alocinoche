<h4 class="login-title">Se Connecter</h4>

<div class="form d-flex flex-column w-50">
  <form #loginForm="ngForm" novalidate>
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      #emailInput="ngModel"
      required
      email
      placeholder="jean.dupont@email.com"
      autocomplete="email"
      class="form-control"
    />

    <button
      type="submit"
      class="btn btn-primary"
      (click)="connect()"
      [disabled]="loginForm.invalid || isLoading"
    >
      <span>{{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}</span>
    </button>
  </form>

  <p class="signup-link">
    Pas de compte ? <a routerLink="/inscription">S'inscrire</a>
  </p>
</div>
