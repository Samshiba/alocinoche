<h4>Mettre à jour le film : {{originalTitle}}</h4>

<div class="form d-flex flex-column w-50">
  <label for="title">Titre</label>
  <input type="text" id="title" name="title" [(ngModel)]="movie.title"/>

  <label for="director">Réalisateur</label>
  <input type="text" id="director" name="director" [(ngModel)]="movie.director"/>

  <label for="release-date">Date de sortie</label>
  <input type="date" id="release-date" name="release-date" [(ngModel)]="releaseDate"/>

  <label for="synopsis">Synopsis</label>
  <textarea id="synopsis" name="synopsis" [(ngModel)]="movie.synopsis"></textarea>

  <button class="btn btn-dark" (click)=updateMovie()>Mettre à jour</button>
</div>
